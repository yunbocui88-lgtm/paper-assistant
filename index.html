<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>论文阅读助手</title>
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Global error capture for debugging -->
    <script>
      window.addEventListener('error', function(e) {
        var msg = '[Paper Assistant Error]\n';
        msg += 'Message: ' + e.message + '\n';
        msg += 'File: ' + e.filename + '\n';
        msg += 'Line: ' + e.lineno + ':' + e.colno + '\n';
        msg += 'Stack: ' + (e.error && e.error.stack ? e.error.stack : 'N/A');
        console.error(msg);
        // Show visible alert on first error
        if (!window.__paperErrorShown) {
          window.__paperErrorShown = true;
          alert(msg);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = '[Paper Assistant Promise Error]\n';
        msg += 'Reason: ' + (e.reason ? (e.reason.message || String(e.reason)) : 'N/A') + '\n';
        msg += 'Stack: ' + (e.reason && e.reason.stack ? e.reason.stack : 'N/A');
        console.error(msg);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
