name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Opt into Node.js 24 early (required by June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Web build → GitHub Pages ────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  # ── Tauri desktop apps ─────────────────────────────────
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            tauri-args: ''
            artifact-glob: 'src-tauri/target/release/bundle/**/*.{AppImage,deb,rpm}'
          - platform: macos-latest
            tauri-args: '--target aarch64-apple-darwin'
            artifact-glob: 'src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.{dmg,app.tar.gz}'
          - platform: macos-latest
            tauri-args: '--target x86_64-apple-darwin'
            artifact-glob: 'src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.{dmg,app.tar.gz}'
          - platform: windows-latest
            tauri-args: ''
            artifact-glob: 'src-tauri/target/release/bundle/**/*.{msi,exe}'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Show what we're about to run (helps debugging)
      - name: Print build info
        shell: bash
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "Tauri args: ${{ matrix.tauri-args }}"
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          npx tauri --version || echo "tauri CLI not yet available"

      # Build Tauri directly (not via tauri-action)
      - name: Build Tauri app
        shell: bash
        run: |
          if [ -n "${{ matrix.tauri-args }}" ]; then
            npx tauri build ${{ matrix.tauri-args }}
          else
            npx tauri build
          fi

      # List artifacts for debugging
      - name: List built artifacts
        shell: bash
        run: |
          echo "=== Built artifacts ==="
          find src-tauri/target -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.app.tar.gz" 2>/dev/null || echo "(no bundles found)"

      # Upload to GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: '论文阅读助手 ${{ github.ref_name }}'
          body: 'See the assets to download and install.'
          draft: true
          prerelease: false
          files: ${{ matrix.artifact-glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
