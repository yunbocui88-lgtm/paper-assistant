name: Build & Release

# Trigger: push a tag like v1.0.0, or manually trigger
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Web build → GitHub Pages (gh-pages branch) ──────────
  # Uses peaceiris/actions-gh-pages to push ./dist → gh-pages branch.
  # No environment setup needed — just set repo Settings → Pages →
  # Source: "Deploy from a branch" → branch: gh-pages, folder: / (root).
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push to gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keep deployment history (default is to force-push a single commit);
          # set to true to preserve a full commit history on gh-pages branch.
          force_orphan: true

  # ── Tauri desktop apps (Windows + Mac + Linux) ──────────
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''                        # Linux: host target is fine
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''                        # Windows: host target (MSVC), no --target needed
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write   # required to create release + upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install cross-compilation targets only for macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Speed up Rust builds across runs
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Tauri v2 requires system libs on Linux (webkit2gtk-4.1)
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '论文阅读助手 v__VERSION__'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
