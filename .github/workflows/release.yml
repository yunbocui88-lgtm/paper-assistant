name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Web → GitHub Pages ──────────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  # ── macOS desktop app ───────────────────────────────────
  release-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-ARM
            platform: macos-latest
            tauri-args: ''
            rust-targets: ''
            bundle-glob: 'src-tauri/target/release/bundle/**/*.dmg'

          - name: macOS-Intel
            platform: macos-latest
            tauri-args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
            bundle-glob: 'src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg'

    name: '${{ matrix.name }}'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build Tauri app
        run: npx tauri build ${{ matrix.tauri-args }}

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Locate the DMG
          DMG=$(find src-tauri/target -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found!"
            find src-tauri/target -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "DMG: $DMG"
          ls -lh "$DMG"
          # Create draft release (idempotent)
          gh release create "${{ github.ref_name }}" \
            --title "论文阅读助手 ${{ github.ref_name }}" \
            --notes "拖入 PDF 即可用 AI 提取关键信息。支持 Apple Silicon / Intel Mac。" \
            --draft \
            --skip-existing
          # Upload asset
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber
